name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      # A red suite must not ship. Release used to run independently of CI,
      # and v0.33.0 went out while CI was failing on Linux-only test text.
      - name: Test
        run: |
          go vet ./...
          go test -race -count=1 ./...
      - name: Build all platforms
        run: |
          set -eu
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
            os=${target%/*}; arch=${target#*/}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.Version=${GITHUB_REF_NAME}" \
              -o dist/roscoe ./cmd/roscoe
            tar -czf "dist/roscoe_${os}_${arch}.tar.gz" -C dist roscoe
            rm dist/roscoe
          done
          (cd dist && sha256sum ./*.tar.gz > SHA256SUMS)
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" dist/* --clobber
